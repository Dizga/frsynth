[project]
name = "frsynth"
version = "0.0.1"
description = "Synthetic-data specialization of a French industrial-incident classifier"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.54.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.5.0",
    "numpy>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.7.0",
]

[project.scripts]
frsynth = "frsynth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frsynth"]

[tool.ruff]
line-length = 100
target-version = "py312"
